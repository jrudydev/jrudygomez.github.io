<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="64" height="64" rx="12" fill="#07090d"/>
  <!-- Outer glow ring -->
  <circle cx="32" cy="32" r="26" fill="#0d1a24" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <!-- Mid ring -->
  <circle cx="32" cy="32" r="18" fill="#0d1a24" stroke="#00d4ff" stroke-width="1" opacity="0.8"/>
  <!-- Inner dark -->
  <circle cx="32" cy="32" r="10" fill="#001a24"/>
  <!-- Core glow -->
  <circle cx="32" cy="32" r="6" fill="#00d4ff" opacity="0.9"/>
  <!-- Center white dot -->
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
  <!-- Orbiting ring -->
  <ellipse cx="32" cy="32" rx="26" ry="7" stroke="#00d4ff" stroke-width="1" opacity="0.4" transform="rotate(-20 32 32)"/>
  <!-- Orbiting dots -->
  <circle cx="9" cy="27" r="1.5" fill="#00d4ff" opacity="0.7"/>
  <circle cx="55" cy="37" r="1.5" fill="#00d4ff" opacity="0.7"/>
  <circle cx="32" cy="7" r="1.5" fill="#00d4ff" opacity="0.5"/>
</svg>
